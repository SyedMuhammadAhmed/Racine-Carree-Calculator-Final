<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="#111827" stroke="#374151" stroke-width="2"/>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>

  <!-- Square Root Symbol -->
  <path d="M 15 55 L 25 55 L 40 80 L 65 25 L 85 25" fill="none" stroke="url(#neonCyan)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- "PRO" Badge -->
  <rect x="50" y="45" width="40" height="20" rx="5" fill="url(#neonPurple)"/>
  <text x="70" y="59" fill="#ffffff" font-family="Arial, sans-serif" font-weight="900" font-size="12" text-anchor="middle" letter-spacing="1">PRO</text>
</svg>
