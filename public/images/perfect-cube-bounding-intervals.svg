<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="100%" height="100%" aria-label="Nearest Perfect Cube Bounding Intervals Diagram">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradCubeBound" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="lowerCubeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.25"/>
    </linearGradient>

    <linearGradient id="targetCubeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="upperCubeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Number Line Glow -->
    <filter id="glowCube" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="440" rx="16" fill="url(#bgGradCubeBound)" stroke="#334155" stroke-width="1.5"/>

  <!-- Subtle Grid Pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="440"/>
    <line x1="200" y1="0" x2="200" y2="440"/>
    <line x1="300" y1="0" x2="300" y2="440"/>
    <line x1="400" y1="0" x2="400" y2="440"/>
    <line x1="500" y1="0" x2="500" y2="440"/>
    <line x1="600" y1="0" x2="600" y2="440"/>
    <line x1="700" y1="0" x2="700" y2="440"/>
  </g>

  <!-- Title & Badge -->
  <g transform="translate(40, 36)">
    <rect x="0" y="0" width="136" height="24" rx="12" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-width="1"/>
    <text x="68" y="16" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">BOUNDING INTERVAL</text>
    <text x="0" y="46" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Nearest Perfect Cube Analysis: k³ &lt; N &lt; (k+1)³</text>
    <text x="0" y="68" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Non-cube integers sit strictly between consecutive whole-cube volumes.</text>
  </g>

  <!-- Three Anchor Cards -->
  <!-- 1. Lower Bound Card (k^3 = 343) -->
  <g transform="translate(40, 130)">
    <rect width="210" height="110" rx="12" fill="url(#lowerCubeGrad)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="16" y="28" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="12" font-weight="700">LOWER BOUND (k³)</text>
    <text x="16" y="64" fill="#ffffff" font-family="ui-monospace, monospace" font-size="30" font-weight="800">343</text>
    <text x="16" y="90" fill="#bfdbfe" font-family="system-ui, sans-serif" font-size="13">Base Root: k = 7 (7³)</text>
  </g>

  <!-- 2. Target Number Card (N = 500) -->
  <g transform="translate(295, 130)">
    <rect width="210" height="110" rx="12" fill="url(#targetCubeGrad)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="16" y="28" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="12" font-weight="700">TARGET NUMBER (N)</text>
    <text x="16" y="64" fill="#ffffff" font-family="ui-monospace, monospace" font-size="30" font-weight="800">500</text>
    <text x="16" y="90" fill="#fde68a" font-family="system-ui, sans-serif" font-size="13">Cube Root: ∛500 ≈ 7.937</text>
  </g>

  <!-- 3. Upper Bound Card ((k+1)^3 = 512) -->
  <g transform="translate(550, 130)">
    <rect width="210" height="110" rx="12" fill="url(#upperCubeGrad)" stroke="#10b981" stroke-width="2"/>
    <rect x="130" y="10" width="70" height="20" rx="10" fill="#10b981" fill-opacity="0.25"/>
    <text x="165" y="24" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">CLOSEST</text>
    <text x="16" y="28" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="700">UPPER BOUND ((k+1)³)</text>
    <text x="16" y="64" fill="#ffffff" font-family="ui-monospace, monospace" font-size="30" font-weight="800">512</text>
    <text x="16" y="90" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="13">Base Root: k+1 = 8 (8³)</text>
  </g>

  <!-- Visual Number Line Track -->
  <g transform="translate(60, 290)">
    <!-- Main Axis Line -->
    <line x1="0" y1="20" x2="680" y2="20" stroke="#475569" stroke-width="4" stroke-linecap="round"/>

    <!-- Segment Lower to Target (343 to 500) -->
    <line x1="40" y1="20" x2="490" y2="20" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <!-- Segment Target to Upper (500 to 512) -->
    <line x1="490" y1="20" x2="640" y2="20" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>

    <!-- Marker: 343 -->
    <circle cx="40" cy="20" r="10" fill="#3b82f6" stroke="#ffffff" stroke-width="2.5"/>
    <text x="40" y="48" fill="#93c5fd" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">343</text>
    <text x="40" y="66" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">k = 7</text>

    <!-- Distance Span Lower: 500 - 343 = 157 -->
    <path d="M 45 6 Q 265 -24 485 6" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>
    <rect x="235" y="-22" width="60" height="20" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="265" y="-8" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="middle">Δ = 157</text>

    <!-- Marker: 500 -->
    <circle cx="490" cy="20" r="12" fill="#f59e0b" stroke="#ffffff" stroke-width="3" filter="url(#glowCube)"/>
    <text x="490" y="48" fill="#fcd34d" font-family="ui-monospace, monospace" font-size="14" font-weight="800" text-anchor="middle">500</text>
    <text x="490" y="66" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Target N</text>

    <!-- Distance Span Upper: 512 - 500 = 12 (WINNER) -->
    <path d="M 495 6 Q 565 -18 635 6" fill="none" stroke="#10b981" stroke-width="2"/>
    <rect x="535" y="-22" width="60" height="20" rx="10" fill="#065f46" stroke="#10b981" stroke-width="1"/>
    <text x="565" y="-8" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="11" font-weight="800" text-anchor="middle">Δ = 12</text>

    <!-- Marker: 512 -->
    <circle cx="640" cy="20" r="10" fill="#10b981" stroke="#ffffff" stroke-width="2.5"/>
    <text x="640" y="48" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">512</text>
    <text x="640" y="66" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">k = 8</text>
  </g>

  <!-- Summary Footer Note -->
  <g transform="translate(60, 395)">
    <rect width="680" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="20" cy="16" r="5" fill="#10b981"/>
    <text x="34" y="20" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">
      <tspan font-weight="700" fill="#10b981">Verdict:</tspan> 512 is the nearest perfect cube to 500 (distance of 12 vs 157 to 343).
    </text>
  </g>
</svg>
