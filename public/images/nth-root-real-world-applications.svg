<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="100%" height="100%" aria-label="Real-World Practical Applications of the Nth Root Formula">
  <defs>
    <linearGradient id="bgGradApps" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadowApps" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="440" rx="16" fill="url(#bgGradApps)" stroke="#334155" stroke-width="1"/>

  <!-- Top Title -->
  <text x="400" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#f59e0b" text-anchor="middle" letter-spacing="1.5">REAL-WORLD SCIENCE &amp; FINANCE FORMULAS</text>
  <text x="400" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">Practical Applications Where Nth Roots Are Essential</text>
  <text x="400" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="middle">Everyday industries relying on arbitrary root extraction</text>

  <!-- 4 Application Cards Grid -->
  <g transform="translate(45, 108)">
    <!-- App 1: Finance (CAGR) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="340" height="145" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadowApps)"/>
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1"/>
      <text x="34" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#38bdf8" text-anchor="middle">$</text>
      <text x="64" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Finance: Annualized Growth (CAGR)</text>
      <text x="64" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#7dd3fc">Investment Portfolio Compounding</text>
      
      <!-- Formula Box -->
      <rect x="16" y="62" width="308" height="36" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="170" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#38bdf8" text-anchor="middle">CAGR = (V_end / V_start)^(1/n) − 1</text>
      
      <text x="16" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Determines annual return over n years.</text>
      <text x="16" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">e.g. $10k to $25k in 8 yrs: ⁸√(2.5) − 1 = 12.14%</text>
    </g>

    <!-- App 2: Statistics (Geometric Mean) -->
    <g transform="translate(370, 0)">
      <rect x="0" y="0" width="340" height="145" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" filter="url(#shadowApps)"/>
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#581c87" fill-opacity="0.3" stroke="#a855f7" stroke-width="1"/>
      <text x="34" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#c084fc" text-anchor="middle">∑</text>
      <text x="64" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Statistics: The Geometric Mean</text>
      <text x="64" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#c084fc">Averaging Ratios, Multiples &amp; Indices</text>
      
      <!-- Formula Box -->
      <rect x="16" y="62" width="308" height="36" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="170" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#c084fc" text-anchor="middle">Geometric Mean = ⁿ√(x₁ · x₂ · ... · xₙ)</text>
      
      <text x="16" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Prevents distortion from percentage outliers.</text>
      <text x="16" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">e.g. 4 return rates: ⁴√(1.2 × 1.5 × 1.1 × 1.8) = 1.374</text>
    </g>

    <!-- App 3: Physics (Stefan-Boltzmann Law) -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="340" height="145" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" filter="url(#shadowApps)"/>
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#881337" fill-opacity="0.3" stroke="#f43f5e" stroke-width="1"/>
      <text x="34" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#fb7185" text-anchor="middle">★</text>
      <text x="64" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Physics: Stefan-Boltzmann Law</text>
      <text x="64" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#fda4af">Black-Body Radiation &amp; Temperature</text>
      
      <!-- Formula Box -->
      <rect x="16" y="62" width="308" height="36" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="170" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#fb7185" text-anchor="middle">Temperature T = ⁴√(E / σ)</text>
      
      <text x="16" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Energy radiated scales with T⁴.</text>
      <text x="16" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Extracting fourth root solves for surface temperature.</text>
    </g>

    <!-- App 4: Acoustics & Music Tuning (12-TET) -->
    <g transform="translate(370, 160)">
      <rect x="0" y="0" width="340" height="145" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#shadowApps)"/>
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#064e3b" fill-opacity="0.3" stroke="#10b981" stroke-width="1"/>
      <text x="34" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#34d399" text-anchor="middle">♫</text>
      <text x="64" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Acoustics: Musical Tuning (12-TET)</text>
      <text x="64" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#6ee7b7">Western Equal Temperament Scale</text>
      
      <!-- Formula Box -->
      <rect x="16" y="62" width="308" height="36" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="170" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#34d399" text-anchor="middle">Frequency Ratio r = ¹²√2 ≈ 1.059463</text>
      
      <text x="16" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Divides one octave into 12 identical semitones.</text>
      <text x="16" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Each note frequency = previous note × ¹²√2.</text>
    </g>
  </g>
</svg>
