<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="100%" height="100%" aria-label="Square Roots 1 to 1000 Milestones and Factoring Patterns">
  <defs>
    <linearGradient id="msBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="msShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="440" rx="16" fill="url(#msBgGrad)" stroke="#334155" stroke-width="1"/>

  <!-- Top Title Bar -->
  <text x="400" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#a78bfa" text-anchor="middle" letter-spacing="1.5">EXTENDED RANGE BENCHMARKS (1 TO 1000)</text>
  <text x="400" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">The 31 Perfect Squares and Century Factoring Rule</text>

  <!-- Timeline Bar (Range 1 to 1000) -->
  <g transform="translate(50, 95)">
    <text x="0" y="16" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#94a3b8">Number Line: 1 to 1000</text>
    <text x="700" y="16" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ec4899" text-anchor="end">31 Total Perfect Squares</text>
    
    <!-- Track -->
    <rect x="0" y="28" width="700" height="14" rx="7" fill="#334155"/>
    <rect x="0" y="28" width="672" height="14" rx="7" fill="url(#barGrad)"/>

    <!-- Key Pinpoints on Timeline -->
    <!-- 1 -->
    <line x1="2" y1="46" x2="2" y2="58" stroke="#38bdf8" stroke-width="2"/>
    <text x="2" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">1² = 1</text>

    <!-- 100 (10%) -->
    <line x1="70" y1="46" x2="70" y2="58" stroke="#818cf8" stroke-width="2"/>
    <text x="70" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#818cf8" text-anchor="middle">10² = 100</text>

    <!-- 400 (40%) -->
    <line x1="280" y1="46" x2="280" y2="58" stroke="#a78bfa" stroke-width="2"/>
    <text x="280" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#a78bfa" text-anchor="middle">20² = 400</text>

    <!-- 900 (90%) -->
    <line x1="630" y1="46" x2="630" y2="58" stroke="#f472b6" stroke-width="2"/>
    <text x="630" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f472b6" text-anchor="middle">30² = 900</text>

    <!-- 961 (31st root) -->
    <line x1="672" y1="46" x2="672" y2="58" stroke="#fb7185" stroke-width="2"/>
    <text x="672" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fb7185" text-anchor="middle">31² = 961</text>
  </g>

  <!-- Century Factoring Cards Grid -->
  <g transform="translate(50, 200)">
    <!-- Box 1: Century Rule -->
    <rect x="0" y="0" width="335" height="135" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="1.2" filter="url(#msShadow)"/>
    <rect x="0" y="0" width="335" height="34" rx="10" fill="#312e81"/>
    <rect x="0" y="20" width="335" height="14" fill="#312e81"/>
    <text x="16" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#e0e7ff">CENTURY FACTORING RULE</text>

    <text x="168" y="64" font-family="ui-monospace, monospace" font-size="16" font-weight="800" fill="#818cf8" text-anchor="middle">√(k × 100) = 10√k</text>
    <text x="168" y="88" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">Scale any 1 to 10 root by multiplying by 10:</text>
    <text x="168" y="112" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">√500 = √(5 × 100) = 10√5 ≈ 22.361</text>

    <!-- Box 2: 32nd Boundary Condition -->
    <rect x="365" y="0" width="335" height="135" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="1.2" filter="url(#msShadow)"/>
    <rect x="365" y="0" width="335" height="34" rx="10" fill="#831843"/>
    <rect x="365" y="20" width="335" height="14" fill="#831843"/>
    <text x="381" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#fce7f3">RANGE BOUNDARY: WHY 31?</text>

    <text x="532" y="64" font-family="ui-monospace, monospace" font-size="16" font-weight="800" fill="#f472b6" text-anchor="middle">31² = 961 ≤ 1000</text>
    <text x="532" y="88" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">The next square exceeds the chart range:</text>
    <text x="532" y="112" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#fb7185" text-anchor="middle">32² = 1024 &gt; 1000 (Excluded)</text>
  </g>

  <!-- Bottom Fast-Lookup Footer -->
  <g transform="translate(50, 360)">
    <rect x="0" y="0" width="700" height="54" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="70" y="32" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#94a3b8">√100 = 10.00</text>
    <text x="210" y="32" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#94a3b8">√200 ≈ 14.14</text>
    <text x="350" y="32" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#94a3b8">√400 = 20.00</text>
    <text x="490" y="32" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#94a3b8">√900 = 30.00</text>
    <text x="630" y="32" font-family="ui-monospace, monospace" font-size="13" font-weight="800" fill="#38bdf8">√1000 ≈ 31.62</text>
  </g>
</svg>
