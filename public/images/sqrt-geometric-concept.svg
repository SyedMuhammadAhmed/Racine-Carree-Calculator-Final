<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" aria-label="Geometric concept of square root: Area to Side Length">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="squareGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <!-- Subtle drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="450" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="230" cy="225" r="180" fill="#6366f1" opacity="0.08"/>
  <circle cx="600" cy="225" r="180" fill="#06b6d4" opacity="0.06"/>

  <!-- Left Side: Geometric 6x6 Square -->
  <g transform="translate(70, 75)">
    <!-- Base 6x6 Grid Container -->
    <rect x="0" y="0" width="240" height="240" rx="12" fill="url(#squareGrad)" filter="url(#shadow)" stroke="#818cf8" stroke-width="2"/>
    
    <!-- 6x6 Internal Grid Lines (40px per tile) -->
    <!-- Vertical Lines -->
    <line x1="40" y1="0" x2="40" y2="240" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
    <line x1="80" y1="0" x2="80" y2="240" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
    <line x1="120" y1="0" x2="120" y2="240" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
    <line x1="160" y1="0" x2="160" y2="240" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
    <line x1="200" y1="0" x2="200" y2="240" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
    <!-- Horizontal Lines -->
    <line x1="0" y1="40" x2="240" y2="40" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
    <line x1="0" y1="80" x2="240" y2="80" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
    <line x1="0" y1="120" x2="240" y2="120" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
    <line x1="0" y1="160" x2="240" y2="160" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
    <line x1="0" y1="200" x2="240" y2="200" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>

    <!-- Center Area Badge -->
    <rect x="50" y="88" width="140" height="64" rx="8" fill="#0f172a" fill-opacity="0.88" stroke="#a5b4fc" stroke-width="1.5"/>
    <text x="120" y="116" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="1">TOTAL AREA</text>
    <text x="120" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">36 units²</text>

    <!-- Bottom Dimension Arrow (Side = 6) -->
    <g transform="translate(0, 260)">
      <line x1="0" y1="0" x2="240" y2="0" stroke="#38bdf8" stroke-width="2"/>
      <path d="M 0,-4 L -6,0 L 0,4 Z" fill="#38bdf8"/>
      <path d="M 240,-4 L 246,0 L 240,4 Z" fill="#38bdf8"/>
      <text x="120" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#38bdf8" text-anchor="middle">Side (s) = 6 units</text>
    </g>

    <!-- Left Dimension Arrow (Side = 6) -->
    <g transform="translate(-20, 0)">
      <line x1="0" y1="0" x2="0" y2="240" stroke="#38bdf8" stroke-width="2"/>
      <path d="M -4,0 L 0,-6 L 4,0 Z" fill="#38bdf8"/>
      <path d="M -4,240 L 0,246 L 4,240 Z" fill="#38bdf8"/>
      <text x="-12" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#38bdf8" text-anchor="middle" transform="rotate(-90 -12 125)">Side (s) = 6 units</text>
    </g>
  </g>

  <!-- Center Transformation Icon / Relation -->
  <g transform="translate(355, 175)">
    <!-- Forward Arrow: Squaring -->
    <path d="M 10, -10 Q 30, -35 50, -10" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="4 2"/>
    <polygon points="50,-10 46,-18 54,-15" fill="#818cf8"/>
    <text x="30" y="-32" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#818cf8" text-anchor="middle">Squaring (6²)</text>

    <!-- Reverse Arrow: Square Root -->
    <path d="M 50, 40 Q 30, 65 10, 40" fill="none" stroke="#10b981" stroke-width="2.5"/>
    <polygon points="10,40 14,48 6,45" fill="#10b981"/>
    <text x="30" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#10b981" text-anchor="middle">Square Root (√36)</text>
  </g>

  <!-- Right Side: Explanation & Formula Card -->
  <g transform="translate(440, 60)">
    <rect width="300" height="290" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    
    <!-- Header -->
    <rect x="20" y="20" width="8" height="24" rx="3" fill="url(#accentGrad)"/>
    <text x="38" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#f8fafc">Geometric Principle</text>

    <!-- Formula Box 1: Area -->
    <g transform="translate(20, 60)">
      <rect width="260" height="52" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="16" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="0.5">SQUARE AREA FORMULA</text>
      <text x="16" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#38bdf8">Area = side × side = 6² = 36</text>
    </g>

    <!-- Formula Box 2: Square Root -->
    <g transform="translate(20, 124)">
      <rect width="260" height="56" rx="8" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="1.5"/>
      <text x="16" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7" letter-spacing="0.5">SQUARE ROOT (INVERSE)</text>
      <text x="16" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#10b981">Side = √Area = √36 = 6</text>
    </g>

    <!-- Key Takeaway Note -->
    <g transform="translate(20, 196)">
      <text x="0" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#cbd5e1" line-height="1.5">
        <tspan x="0" dy="0">A square root gives you the exact</tspan>
        <tspan x="0" dy="18">side length needed to construct a</tspan>
        <tspan x="0" dy="18">geometric square with that total area.</tspan>
      </text>
    </g>

    <!-- Footer pill badge -->
    <rect x="20" y="248" width="136" height="24" rx="12" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
    <text x="88" y="264" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#c7d2fe" text-anchor="middle">y × y = x ⟺ y = √x</text>
  </g>

  <!-- Bottom Brand Watermark -->
  <text x="400" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="0.5">RACINE CARREE CALCULATOR &#8226; GEOMETRIC SQUARE ROOT MODEL</text>
</svg>
