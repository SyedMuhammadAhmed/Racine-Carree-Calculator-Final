<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" aria-label="Anatomy of a Cube Root: Radical Sign, Index 3, Radicand, and Root">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradAnatomy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadowAnatomy" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="420" rx="16" fill="url(#bgGradAnatomy)" stroke="#334155" stroke-width="1"/>

  <!-- Subtle Glow Circles Behind Expression -->
  <circle cx="270" cy="195" r="140" fill="#a855f7" opacity="0.1"/>
  <circle cx="560" cy="195" r="140" fill="#10b981" opacity="0.1"/>

  <!-- Top Title -->
  <text x="400" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#818cf8" text-anchor="middle" letter-spacing="1.5">MATHEMATICAL NOTATION ANATOMY</text>
  <text x="400" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">Every Component of the Cube Root Expression: ∛64 = 4</text>

  <!-- Main Math Expression Box -->
  <g transform="translate(130, 95)">
    <!-- Main Center Panel -->
    <rect x="0" y="0" width="540" height="190" rx="16" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1.5" filter="url(#shadowAnatomy)"/>

    <!-- 1. Index 3 Callout (Top-Left) -->
    <rect x="18" y="-14" width="145" height="38" rx="8" fill="#3b0764" stroke="#c084fc" stroke-width="1.5"/>
    <text x="90" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#f3e8ff" text-anchor="middle">Index = 3 (Degree)</text>
    <line x1="90" y1="24" x2="114" y2="72" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="114" cy="72" r="3.5" fill="#c084fc"/>

    <!-- Superscript Index 3 character sitting right above radical hook -->
    <text x="114" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#c084fc">3</text>

    <!-- 2. Radical Symbol (√) -->
    <!-- Hook at (130, 125) -> down-left (142, 148) -> up-right through (178, 68) -> bar (335, 68) -->
    <path d="M 130,126 L 144,152 L 180,68 L 335,68" fill="none" stroke="#6366f1" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Radical Symbol Callout (Bottom-Left) -->
    <rect x="25" y="156" width="145" height="44" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
    <text x="97" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#818cf8" text-anchor="middle">Radical Sign (√)</text>
    <text x="97" y="191" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="middle">Surd / root operator</text>
    <line x1="145" y1="156" x2="150" y2="140" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="150" cy="140" r="3.5" fill="#818cf8"/>

    <!-- 3. Vinculum (Horizontal Bar) Callout (Top-Middle) -->
    <rect x="200" y="-14" width="145" height="38" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="272" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle">Vinculum (Overbar)</text>
    <line x1="272" y1="24" x2="272" y2="65" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="272" cy="65" r="3.5" fill="#38bdf8"/>

    <!-- 4. Radicand (64) -->
    <text x="254" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="62" font-weight="800" fill="#38bdf8" text-anchor="middle">64</text>

    <!-- Radicand Callout (Bottom-Middle) -->
    <rect x="195" y="156" width="145" height="44" rx="8" fill="#0c4a6e" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="267" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#7dd3fc" text-anchor="middle">Radicand (64)</text>
    <text x="267" y="191" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#bae6fd" text-anchor="middle">Value inside radical</text>
    <line x1="267" y1="156" x2="267" y2="145" stroke="#0ea5e9" stroke-width="1.5"/>

    <!-- Equal Sign -->
    <text x="372" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="500" fill="#94a3b8" text-anchor="middle">=</text>

    <!-- 5. Root / Result (4) -->
    <text x="445" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#10b981" text-anchor="middle">4</text>

    <!-- Root Callout (Right Side) -->
    <rect x="385" y="156" width="138" height="44" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="454" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#6ee7b7" text-anchor="middle">Cube Root (4)</text>
    <text x="454" y="191" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#a7f3d0" text-anchor="middle">Since 4³ = 4×4×4 = 64</text>
    <line x1="454" y1="156" x2="454" y2="146" stroke="#10b981" stroke-width="1.5"/>
  </g>

  <!-- Bottom Explanatory Badges -->
  <g transform="translate(60, 315)">
    <!-- Badge 1: Mandatory Index Rule -->
    <g transform="translate(0, 0)">
      <rect width="330" height="74" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
      <circle cx="24" cy="24" r="10" fill="#a855f7" fill-opacity="0.2"/>
      <text x="24" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#c084fc" text-anchor="middle">!</text>
      <text x="44" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#f8fafc">Index 3 Is Never Optional</text>
      <text x="16" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Square roots omit "2" (√64 = 8).</text>
      <text x="16" y="63" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#c084fc">Cube roots MUST write "3" (∛64 = 4).</text>
    </g>

    <!-- Badge 2: Exponent & Negatives -->
    <g transform="translate(350, 0)">
      <rect width="330" height="74" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
      <circle cx="24" cy="24" r="10" fill="#10b981" fill-opacity="0.2"/>
      <text x="24" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#34d399" text-anchor="middle">✓</text>
      <text x="44" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#f8fafc">Equivalent Exponent &amp; Negative Support</text>
      <text x="16" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Fractional power form: <tspan font-weight="700" fill="#38bdf8">∛x = x^(1/3)</tspan></text>
      <text x="16" y="63" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#34d399">Works with negatives: ∛(-64) = -4</text>
    </g>
  </g>
</svg>
