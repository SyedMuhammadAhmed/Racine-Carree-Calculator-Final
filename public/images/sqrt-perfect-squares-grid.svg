      <!-- Row 1 -->
      <rect x="0" y="0" width="13" height="13" rx="1.5" fill="url(#tileGrad)" stroke="#a5b4fc" stroke-width="0.7"/>
      <rect x="16" y="0" width="13" height="13" rx="1.5" fill="url(#tileGrad)" stroke="#a5b4fc" stroke-width="0.7"/>
      <rect x="32" y="0" width="13" height="13" rx="1.5" fill="url(#tileGrad)" stroke="#a5b4fc" stroke-width="0.7"/>
      <rect x="48" y="0" width="13" height="13" rx="1.5" fill="url(#tileGrad)" stroke="#a5b4fc" stroke-width="0.7"/>
      <rect x="64" y="0" width="13" height="13" rx="1.5" fill="url(#tileGrad)" stroke="#a5b4fc" stroke-width="0.7"/>
      <!-- Row 2 -->
      <rect x="0" y="16" width="13" height="13" rx="1.5" fill="url(#tileGrad)" stroke="#a5b4fc" stroke-width="0.7"/>
      <rect x="16" y="16" width="13" height="13" rx="1.5" fill="url(#tileGrad)" stroke="#a5b4fc" stroke-width="0.7"/>
      <rect x="32" y="16" width="13" height="13" rx="1.5" fill="url(#tileGrad)" stroke="#a5b4fc" stroke-width="0.7"/>
      <rect x="48" y="16" width="13" height="13" rx="1.5" fill="url(#tileGrad)" stroke="#a5b4fc" stroke-width="0.7"/>
      <rect x="64" y="16" width="13" height="13" rx="1.5" fill="url(#tileGrad)" stroke="#a5b4fc" stroke-width="0.7"/>
      <!-- Row 3 -->
      <rect x="0" y="32" width="13" height="13" rx="1.5" fill="url(#tileGrad)" stroke="#a5b4fc" stroke-width="0.7"/>
      <rect x="16" y="32" width="13" height="13" rx="1.5" fill="url(#tileGrad)" stroke="#a5b4fc" stroke-width="0.7"/>
      <rect x="32" y="32" width="13" height="13" rx="1.5" fill="url(#tileGrad)" stroke="#a5b4fc" stroke-width="0.7"/>
      <rect x="48" y="32" width="13" height="13" rx="1.5" fill="url(#tileGrad)" stroke="#a5b4fc" stroke-width="0.7"/>
      <rect x="64" y="32" width="13" height="13" rx="1.5" fill="url(#tileGrad)" stroke="#a5b4fc" stroke-width="0.7"/>
      <!-- Row 4 -->
      <rect x="0" y="48" width="13" height="13" rx="1.5" fill="url(#tileGrad)" stroke="#a5b4fc" stroke-width="0.7"/>
      <rect x="16" y="48" width="13" height="13" rx="1.5" fill="url(#tileGrad)" stroke="#a5b4fc" stroke-width="0.7"/>
      <rect x="32" y="48" width="13" height="13" rx="1.5" fill="url(#tileGrad)" stroke="#a5b4fc" stroke-width="0.7"/>
      <rect x="48" y="48" width="13" height="13" rx="1.5" fill="url(#tileGrad)" stroke="#a5b4fc" stroke-width="0.7"/>
      <rect x="64" y="48" width="13" height="13" rx="1.5" fill="url(#tileGrad)" stroke="#a5b4fc" stroke-width="0.7"/>
      <!-- Row 5 -->
      <rect x="0" y="64" width="13" height="13" rx="1.5" fill="url(#tileGrad)" stroke="#a5b4fc" stroke-width="0.7"/>
      <rect x="16" y="64" width="13" height="13" rx="1.5" fill="url(#tileGrad)" stroke="#a5b4fc" stroke-width="0.7"/>
      <rect x="32" y="64" width="13" height="13" rx="1.5" fill="url(#tileGrad)" stroke="#a5b4fc" stroke-width="0.7"/>
      <rect x="48" y="64" width="13" height="13" rx="1.5" fill="url(#tileGrad)" stroke="#a5b4fc" stroke-width="0.7"/>
      <rect x="64" y="64" width="13" height="13" rx="1.5" fill="url(#tileGrad)" stroke="#a5b4fc" stroke-width="0.7"/>
    </g>

    <!-- Formula & Root -->
