      <rect x="20" y="0" width="17" height="17" rx="2" fill="url(#tileGrad)" stroke="#a5b4fc" stroke-width="0.8"/>
      <rect x="40" y="0" width="17" height="17" rx="2" fill="url(#tileGrad)" stroke="#a5b4fc" stroke-width="0.8"/>
      <!-- Row 2 -->
      <rect x="0" y="20" width="17" height="17" rx="2" fill="url(#tileGrad)" stroke="#a5b4fc" stroke-width="0.8"/>
      <rect x="20" y="20" width="17" height="17" rx="2" fill="url(#tileGrad)" stroke="#a5b4fc" stroke-width="0.8"/>
      <rect x="40" y="20" width="17" height="17" rx="2" fill="url(#tileGrad)" stroke="#a5b4fc" stroke-width="0.8"/>
      <!-- Row 3 -->
      <rect x="0" y="40" width="17" height="17" rx="2" fill="url(#tileGrad)" stroke="#a5b4fc" stroke-width="0.8"/>
      <rect x="20" y="40" width="17" height="17" rx="2" fill="url(#tileGrad)" stroke="#a5b4fc" stroke-width="0.8"/>
      <rect x="40" y="40" width="17" height="17" rx="2" fill="url(#tileGrad)" stroke="#a5b4fc" stroke-width="0.8"/>
