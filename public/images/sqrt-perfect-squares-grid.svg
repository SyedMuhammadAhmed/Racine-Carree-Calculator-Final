      <rect x="18" y="0" width="15" height="15" rx="2" fill="url(#tileGrad)" stroke="#a5b4fc" stroke-width="0.8"/>
      <rect x="36" y="0" width="15" height="15" rx="2" fill="url(#tileGrad)" stroke="#a5b4fc" stroke-width="0.8"/>
      <rect x="54" y="0" width="15" height="15" rx="2" fill="url(#tileGrad)" stroke="#a5b4fc" stroke-width="0.8"/>
      <!-- Row 2 -->
