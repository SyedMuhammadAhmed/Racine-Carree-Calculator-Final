    <text x="65" y="187" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">5² = 25</text>
    
    <rect x="15" y="208" width="100" height="34" rx="6" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="1"/>
    <text x="65" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#6ee7b7" text-anchor="middle">√25 = 5</text>
  </g>

  <!-- Footer Watermark -->
  <text x="400" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="0.5">RACINE CARREE CALCULATOR &#8226; PERFECT SQUARES VISUAL PROOF</text>
</svg>
