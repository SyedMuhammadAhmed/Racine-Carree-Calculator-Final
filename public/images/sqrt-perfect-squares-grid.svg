    <text x="65" y="187" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">4² = 16</text>
    
    <rect x="15" y="208" width="100" height="34" rx="6" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="1"/>
    <text x="65" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#6ee7b7" text-anchor="middle">√16 = 4</text>
  </g>

  <!-- Column 5: 5² = 25 -->
  <g transform="translate(615, 95)">
    <rect width="130" height="260" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1.2" filter="url(#shadow3)"/>
