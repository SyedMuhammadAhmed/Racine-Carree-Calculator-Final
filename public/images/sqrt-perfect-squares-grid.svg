<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" aria-label="Geometric progression of perfect squares 1 through 5">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <!-- Card Gradient -->
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" rx="16" fill="url(#bgGrad3)" stroke="#334155" stroke-width="1"/>

  <!-- Top Header -->
  <text x="400" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#818cf8" text-anchor="middle" letter-spacing="1.5">GEOMETRIC PROGRESSION OF SQUARE NUMBERS</text>
  <text x="400" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">Why They Are Called &quot;Square&quot; Numbers: 1² to 5²</text>

  <!-- 5 Columns Grid Container (Width 740, 140px pitch) -->

  <!-- Column 1: 1² = 1 -->
  <g transform="translate(35, 95)">
    <rect width="130" height="260" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1.2" filter="url(#shadow3)"/>
    <text x="65" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#94a3b8" text-anchor="middle">n = 1</text>
    
    <!-- 1x1 Grid in a 100x100 zone -->
    <g transform="translate(45, 55)">
      <rect x="0" y="0" width="40" height="40" rx="4" fill="url(#tileGrad)" stroke="#a5b4fc" stroke-width="1.5"/>
    </g>

    <!-- Formula & Root -->
    <rect x="15" y="165" width="100" height="34" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="65" y="187" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">1² = 1</text>
    
    <rect x="15" y="208" width="100" height="34" rx="6" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="1"/>
    <text x="65" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#6ee7b7" text-anchor="middle">√1 = 1</text>
  </g>

  <!-- Column 2: 2² = 4 -->
  <g transform="translate(180, 95)">
    <rect width="130" height="260" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1.2" filter="url(#shadow3)"/>
    <text x="65" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#94a3b8" text-anchor="middle">n = 2</text>
    
    <!-- 2x2 Grid (Each tile 22px, gap 3px) -->
    <g transform="translate(41, 52)">
      <rect x="0" y="0" width="22" height="22" rx="3" fill="url(#tileGrad)" stroke="#a5b4fc" stroke-width="1"/>
      <rect x="25" y="0" width="22" height="22" rx="3" fill="url(#tileGrad)" stroke="#a5b4fc" stroke-width="1"/>
      <rect x="0" y="25" width="22" height="22" rx="3" fill="url(#tileGrad)" stroke="#a5b4fc" stroke-width="1"/>
      <rect x="25" y="25" width="22" height="22" rx="3" fill="url(#tileGrad)" stroke="#a5b4fc" stroke-width="1"/>
    </g>

