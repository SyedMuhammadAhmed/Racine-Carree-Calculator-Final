  <!-- Column 3: 3² = 9 -->
  <g transform="translate(325, 95)">
    <rect width="130" height="260" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1.2" filter="url(#shadow3)"/>
    <text x="65" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#94a3b8" text-anchor="middle">n = 3</text>
    
