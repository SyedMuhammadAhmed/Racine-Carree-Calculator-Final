<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="100%" height="100%" aria-label="Even versus Odd Root Degree Behavior Rules">
  <defs>
    <linearGradient id="bgGradEvenOdd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadowEvenOdd" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="440" rx="16" fill="url(#bgGradEvenOdd)" stroke="#334155" stroke-width="1"/>

  <!-- Top Title -->
  <text x="400" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">DOMAIN &amp; SOLUTION BEHAVIOR RULES</text>
  <text x="400" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">Even vs. Odd Root Indices: Real vs. Complex Domain</text>
  <text x="400" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="middle">How root degree and radicand sign determine mathematical output</text>

  <!-- Left Column: Odd Indices (n = 3, 5, 7...) -->
  <g transform="translate(45, 105)">
    <rect x="0" y="0" width="340" height="305" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadowEvenOdd)"/>
    
    <!-- Header Badge -->
    <rect x="20" y="16" width="300" height="36" rx="8" fill="#1d4ed8" fill-opacity="0.25" stroke="#3b82f6" stroke-width="1"/>
    <text x="170" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#93c5fd" text-anchor="middle">ODD ROOT INDICES (n = 3, 5, 7, 9...)</text>

    <!-- Scenario 1: Positive Radicand -->
    <g transform="translate(20, 68)">
      <rect x="0" y="0" width="300" height="66" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <circle cx="24" cy="24" r="10" fill="#10b981"/>
      <text x="24" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">+</text>
      <text x="45" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#34d399">Positive Radicand (x &gt; 0)</text>
      <text x="45" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Yields 1 real positive root</text>
      <text x="285" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="end">∛27 = 3</text>
    </g>

    <!-- Scenario 2: Negative Radicand -->
    <g transform="translate(20, 144)">
      <rect x="0" y="0" width="300" height="66" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <circle cx="24" cy="24" r="10" fill="#6366f1"/>
      <text x="24" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">−</text>
      <text x="45" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#818cf8">Negative Radicand (x &lt; 0)</text>
      <text x="45" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Yields 1 real negative root</text>
      <text x="285" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="end">∛(-27) = -3</text>
    </g>

    <!-- Explanation Box -->
    <g transform="translate(20, 220)">
      <rect x="0" y="0" width="300" height="70" rx="8" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
      <text x="14" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#a5b4fc">Why It Works in Real Numbers:</text>
      <text x="14" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#c7d2fe">An odd count of negative factors stays negative:</text>
      <text x="14" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff">(-3) × (-3) × (-3) = -27 (Fully Valid Real Root)</text>
    </g>
  </g>

  <!-- Right Column: Even Indices (n = 2, 4, 6...) -->
  <g transform="translate(415, 105)">
    <rect x="0" y="0" width="340" height="305" rx="14" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" filter="url(#shadowEvenOdd)"/>
    
    <!-- Header Badge -->
    <rect x="20" y="16" width="300" height="36" rx="8" fill="#be123c" fill-opacity="0.25" stroke="#f43f5e" stroke-width="1"/>
    <text x="170" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#fda4af" text-anchor="middle">EVEN ROOT INDICES (n = 2, 4, 6, 8...)</text>

    <!-- Scenario 1: Positive Radicand -->
    <g transform="translate(20, 68)">
      <rect x="0" y="0" width="300" height="66" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <circle cx="24" cy="24" r="10" fill="#10b981"/>
      <text x="24" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">+</text>
      <text x="45" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#34d399">Positive Radicand (x &gt; 0)</text>
      <text x="45" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">2 real roots (±), principal is positive</text>
      <text x="285" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="end">⁴√16 = 2</text>
    </g>

    <!-- Scenario 2: Negative Radicand -->
    <g transform="translate(20, 144)">
      <rect x="0" y="0" width="300" height="66" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <circle cx="24" cy="24" r="10" fill="#ef4444"/>
      <text x="24" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">✕</text>
      <text x="45" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#f87171">Negative Radicand (x &lt; 0)</text>
      <text x="45" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#fda4af">No real roots (Complex Plane only)</text>
      <text x="285" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#f87171" text-anchor="end">√(-16) = 4i</text>
    </g>

    <!-- Explanation Box -->
    <g transform="translate(20, 220)">
      <rect x="0" y="0" width="300" height="70" rx="8" fill="#4c0519" stroke="#9f1239" stroke-width="1"/>
      <text x="14" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#fecdd3">Crucial Real Domain Limitation:</text>
      <text x="14" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#ffe4e6">An even power of any real number is non-negative.</text>
      <text x="14" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#fda4af">Requires imaginary unit i: i = √(-1)</text>
    </g>
  </g>
</svg>
