<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="100%" height="100%" aria-label="Spreadsheet Square Root Table Formula Workflow">
  <defs>
    <linearGradient id="ssBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="ssShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="440" rx="16" fill="url(#ssBgGrad)" stroke="#334155" stroke-width="1"/>

  <!-- Top Title Bar -->
  <text x="400" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="1.5">SPREADSHEET AUTOMATION &amp; FORMULA WORKFLOW</text>
  <text x="400" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">Generating Custom Square Root Tables in Excel &amp; Sheets</text>

  <!-- Mock Spreadsheet UI Container -->
  <g transform="translate(45, 95)" filter="url(#ssShadow)">
    <rect width="710" height="235" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>

    <!-- Spreadsheet Formula Bar -->
    <rect x="0" y="0" width="710" height="34" rx="8" fill="#0f172a"/>
    <rect x="0" y="20" width="710" height="14" fill="#0f172a"/>
    <line x1="0" y1="34" x2="710" y2="34" stroke="#334155" stroke-width="1"/>

    <!-- Name box & fx -->
    <rect x="8" y="6" width="45" height="22" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
    <text x="30" y="21" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">B2</text>
    <text x="68" y="22" font-family="serif" font-size="14" font-style="italic" font-weight="700" fill="#10b981">fx</text>
    <rect x="85" y="6" width="615" height="22" rx="4" fill="#022c22" stroke="#059669" stroke-width="1"/>
    <text x="96" y="21" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#6ee7b7">=SQRT(A2)</text>

    <!-- Spreadsheet Column Headers -->
    <rect x="0" y="34" width="710" height="28" fill="#1e293b"/>
    <line x1="0" y1="62" x2="710" y2="62" stroke="#334155" stroke-width="1"/>
    <!-- Col Letters -->
    <rect x="0" y="34" width="45" height="28" fill="#0f172a"/>
    <line x1="45" y1="34" x2="45" y2="235" stroke="#334155" stroke-width="1"/>
    <text x="135" y="52" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">A (Number)</text>
    <line x1="225" y1="34" x2="225" y2="235" stroke="#334155" stroke-width="1"/>
    <text x="350" y="52" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">B (Root: =SQRT(A2))</text>
    <line x1="475" y1="34" x2="475" y2="235" stroke="#334155" stroke-width="1"/>
    <text x="590" y="52" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">C (Classification)</text>

    <!-- Row 1 (Header in Table) -->
    <g transform="translate(0, 62)">
      <rect width="45" height="40" fill="#0f172a"/>
      <text x="22" y="25" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">2</text>
      <text x="135" y="25" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
      <!-- Active Cell B2 with green highlight -->
      <rect x="226" y="1" width="248" height="38" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981" stroke-width="1.8"/>
      <rect x="470" y="36" width="6" height="6" fill="#10b981"/> <!-- Fill Handle -->
      <text x="350" y="25" font-family="ui-monospace, monospace" font-size="13" font-weight="800" fill="#34d399" text-anchor="middle">1.000</text>
      <text x="590" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#818cf8" text-anchor="middle">Perfect Square</text>
      <line x1="0" y1="40" x2="710" y2="40" stroke="#334155" stroke-width="0.8"/>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0, 102)">
      <rect width="45" height="40" fill="#0f172a"/>
      <text x="22" y="25" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">3</text>
      <text x="135" y="25" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
      <text x="350" y="25" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#cbd5e1" text-anchor="middle">1.414</text>
      <text x="590" y="25" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Irrational</text>
      <line x1="0" y1="40" x2="710" y2="40" stroke="#334155" stroke-width="0.8"/>
    </g>

    <!-- Row 3 -->
    <g transform="translate(0, 142)">
      <rect width="45" height="40" fill="#0f172a"/>
      <text x="22" y="25" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">4</text>
      <text x="135" y="25" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
      <text x="350" y="25" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#cbd5e1" text-anchor="middle">1.732</text>
      <text x="590" y="25" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Irrational</text>
      <line x1="0" y1="40" x2="710" y2="40" stroke="#334155" stroke-width="0.8"/>
    </g>

    <!-- Row 4 -->
    <g transform="translate(0, 182)">
      <rect width="45" height="40" fill="#0f172a"/>
      <text x="22" y="25" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">5</text>
      <text x="135" y="25" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
      <text x="350" y="25" font-family="ui-monospace, monospace" font-size="13" font-weight="800" fill="#34d399" text-anchor="middle">2.000</text>
      <text x="590" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#818cf8" text-anchor="middle">Perfect Square</text>
    </g>
  </g>

  <!-- Formula Callout Tooltips at Bottom -->
  <g transform="translate(45, 350)">
    <!-- Tip 1 -->
    <rect x="0" y="0" width="340" height="66" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
    <text x="16" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7">SQUARE ROOT FUNCTION</text>
    <text x="16" y="48" font-family="ui-monospace, monospace" font-size="13" font-weight="800" fill="#ffffff">=SQRT(cell_reference)</text>

    <!-- Tip 2 -->
    <rect x="365" y="0" width="345" height="66" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.2"/>
    <text x="381" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#a5b4fc">PERFECT SQUARE DETECTOR</text>
    <text x="381" y="48" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#ffffff">=IF(SQRT(A2)=INT(SQRT(A2)),&quot;Perfect&quot;,&quot;Irrational&quot;)</text>
  </g>
</svg>
